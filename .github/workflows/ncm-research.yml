name: Tiny-LLM NCM research checks

on:
  push:
    branches:
      - research/ncm-evaluation-bridge
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyTorch CPU
        run: python -m pip install "torch>=2.3,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Run all unit tests
        run: python -m unittest discover -s tests -v
      - name: Export actual Cake Galaxy FAQ dataset
        run: python experiments/ncm/prepare_dataset.py
      - name: Validate exported dataset size and manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("experiments/ncm/generated")
          stats = json.loads((p / "manifest.json").read_text(encoding="utf-8"))
          train = [json.loads(s) for s in (p / "train.jsonl").read_text(encoding="utf-8").splitlines()]
          val = [json.loads(s) for s in (p / "validation.jsonl").read_text(encoding="utf-8").splitlines()]
          assert stats["facts"] == 60, stats
          assert len(train) == 180 and len(val) == 60, stats
          assert not (set(x["id"] for x in train) & set(x["id"] for x in val))
          assert not stats["model_training_performed"]
          print("NCM research export checks passed")
          PY
      - name: Run grounded baseline sanity check
        run: python experiments/ncm/eval_grounded.py
